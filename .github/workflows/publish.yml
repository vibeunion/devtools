name: Publish packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish for all packages"
        required: true
        default: "0.1.1"
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-26.04
    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Determine release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          AUTO_VERSION: ${{ needs.release-please.outputs.version }}
          AUTO_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            tag="v$version"
          else
            version="$AUTO_VERSION"
            tag="$AUTO_TAG_NAME"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Set up npm trusted publishing
        run: |
          npm install --global npm@12.2.1
          npm --version

      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Rewrite workspace dependencies for publication
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packages = ['protocol', 'devframe', 'supacloud'];
          const versions = new Map();
          for (const name of packages) {
            const file = `packages/${name}/package.json`;
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
            versions.set(pkg.name, pkg.version);
          }
          for (const name of packages) {
            const file = `packages/${name}/package.json`;
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const field of ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']) {
              for (const [dependency, range] of Object.entries(pkg[field] ?? {})) {
                if (range === 'workspace:*' && versions.has(dependency)) {
                  pkg[field][dependency] = `^${versions.get(dependency)}`;
                }
              }
            }
            fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          NODE

      - name: Verify publish archives
        run: bun run scripts/check-packs.ts

      - name: Publish protocol
        working-directory: packages/protocol
        run: npm publish --access public --workspaces=false

      - name: Publish Devframe
        working-directory: packages/devframe
        run: npm publish --access public --workspaces=false

      - name: Publish SupaCloud adapter
        working-directory: packages/supacloud
        run: npm publish --access public --workspaces=false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
          fi
